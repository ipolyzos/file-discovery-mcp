[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fd-mcp"
version = "0.1.0"
description = "Read-only MCP server for fd/find-style filesystem discovery"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Ioannis Polyzos" }]
keywords = ["mcp", "filesystem", "fd", "find", "model-context-protocol"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "mcp>=1.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
fd-mcp = "fd_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fd_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/fd_mcp", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
